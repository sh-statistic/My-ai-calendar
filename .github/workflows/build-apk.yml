name: Build and Release APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Decode Release Keystore (if secret is configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "Keystore successfully decoded into my-upload-key.jks"
          else
            echo "No KEYSTORE_BASE64 secret provided; Gradle will fallback to repository debug.keystore"
          fi

      - name: Run backup unit tests
        run: ./gradlew testDebugUnitTest --tests "com.example.BackupRoundTripTest" --stacktrace

      - name: Build Release APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name APK with version
        id: apkname
        run: |
          VERSION_NAME=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NEW_NAME="MyCalendar-${GITHUB_REF_NAME}.apk"
          else
            NEW_NAME="MyCalendar-v${VERSION_NAME}-code${VERSION_CODE}.apk"
          fi
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/${NEW_NAME}"
          echo "artifact_name=${NEW_NAME%.apk}" >> "$GITHUB_OUTPUT"
          echo "Renamed APK to ${NEW_NAME}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apkname.outputs.artifact_name }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
