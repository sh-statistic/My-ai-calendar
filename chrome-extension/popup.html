<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>همگام - تقویم خورشیدی و همگام‌سازی</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-border: #E2E8F0;
      --text: #1E293B;
      --text-muted: #64748B;
      --primary: #D97706;
      --primary-dark: #B45309;
      --primary-light: #FEF3C7;
      --blue: #2563EB;
      --green: #16A34A;
      --red: #DC2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif; }
    body {
      width: 380px;
      min-height: 540px;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--surface-border);
      margin-bottom: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: var(--primary);
      font-size: 15px;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: 0.2s;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-blue { background: var(--blue); }
    .btn-blue:hover { background: #1D4ED8; }
    .btn-outline { background: transparent; border: 1px solid var(--surface-border); color: var(--text); }
    .btn-outline:hover { background: #F1F5F9; }

    .date-card {
      background: var(--surface);
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      margin-bottom: 8px;
      border: 1px solid var(--surface-border);
    }
    .date-solar { font-size: 15px; font-weight: 800; color: var(--primary-dark); }
    .date-gregorian { font-size: 11px; color: var(--text-muted); }
    .occasion-badge { display: inline-block; font-size: 10px; background: #FEE2E2; color: #991B1B; padding: 2px 6px; border-radius: 6px; margin-top: 4px; font-weight: bold; }

    /* QR Code Display on Laptop Screen */
    .qr-card {
      background: var(--surface);
      border: 1px solid var(--primary-light);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .qr-title { font-size: 11px; font-weight: bold; color: var(--primary-dark); margin-bottom: 4px; }
    .qr-box { display: flex; justify-content: center; align-items: center; margin: 6px 0; }
    .qr-img { width: 130px; height: 130px; border-radius: 6px; border: 1px solid var(--surface-border); }
    .qr-tip { font-size: 10px; color: var(--text-muted); line-height: 15px; }

    /* Prayer Times Widget */
    .prayer-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .prayer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .city-select { font-size: 11px; font-weight: bold; border-radius: 6px; border: 1px solid var(--surface-border); padding: 2px 4px; }
    .prayer-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; text-align: center; }
    .prayer-cell { background: #F8FAFC; border: 1px solid var(--surface-border); border-radius: 5px; padding: 3px 1px; }
    .prayer-name { font-size: 8px; color: var(--text-muted); }
    .prayer-time { font-size: 9px; font-weight: bold; color: var(--text); }

    .section-title { font-size: 11px; font-weight: bold; color: var(--text-muted); margin: 6px 0 4px; display: flex; justify-content: space-between; }
    .items-list { display: flex; flex-direction: column; gap: 4px; max-height: 80px; overflow-y: auto; margin-bottom: 6px; }
    .item-card { background: var(--surface); border-radius: 6px; padding: 5px 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--surface-border); border-right: 3px solid var(--primary); font-size: 11px; }
    .empty-state { text-align: center; color: var(--text-muted); font-size: 10px; padding: 6px; background: var(--surface); border-radius: 6px; border: 1px dashed var(--surface-border); }

    .quick-note textarea { width: 100%; height: 36px; border: 1px solid var(--surface-border); border-radius: 6px; padding: 4px 6px; font-size: 11px; resize: none; margin-bottom: 4px; }
    .quick-note button { width: 100%; background: var(--primary); color: white; border: none; padding: 4px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; }

    .status-bar { font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>☀️</span>
      <span>همگام</span>
    </div>
    <div style="display: flex; gap: 4px;">
      <button id="btnSync" class="btn" title="همگام‌سازی سریع با وای‌فای">🔄 همگام</button>
      <button id="btnBleSync" class="btn btn-blue" title="اتصال با بلوتوث">📡 بلوتوث</button>
    </div>
  </header>

  <div class="date-card">
    <div class="date-solar" id="solarDateText">امروز</div>
    <div class="date-gregorian" id="gregorianDateText">میلادی</div>
    <div id="occasionBadge" class="occasion-badge" style="display: none;"></div>
  </div>

  <!-- QR Code Pairing Card Displayed on Laptop Screen -->
  <div class="qr-card">
    <div class="qr-title">📱 اسکن بارکد با دوربین گوشی جهت اتصال فوری</div>
    <div class="qr-box">
      <img id="qrImg" class="qr-img" alt="کد QR اتصال">
    </div>
    <div class="qr-tip" id="serverInfoText">در حال دریافت آدرس سرور گوشی...</div>
  </div>

  <!-- Offline Prayer Times -->
  <div class="prayer-card">
    <div class="prayer-header">
      <select id="citySelect" class="city-select"></select>
      <span id="nextPrayerBadge" style="font-size: 10px; color: var(--primary); font-weight: bold;">--</span>
    </div>
    <div class="prayer-grid">
      <div class="prayer-cell"><div class="prayer-name">صبح</div><div class="prayer-time" id="t-fajr">--:--</div></div>
      <div class="prayer-cell"><div class="prayer-name">طلوع</div><div class="prayer-time" id="t-sunrise">--:--</div></div>
      <div class="prayer-cell"><div class="prayer-name">ظهر</div><div class="prayer-time" id="t-dhuhr">--:--</div></div>
      <div class="prayer-cell"><div class="prayer-name">غروب</div><div class="prayer-time" id="t-sunset">--:--</div></div>
      <div class="prayer-cell"><div class="prayer-name">مغرب</div><div class="prayer-time" id="t-maghrib">--:--</div></div>
      <div class="prayer-cell"><div class="prayer-name">نیمه‌شب</div><div class="prayer-time" id="t-midnight">--:--</div></div>
    </div>
  </div>

  <div class="section-title">
    <span>رویدادهای امروز</span>
    <span id="eventsCount">۰</span>
  </div>
  <div class="items-list" id="eventsList">
    <div class="empty-state">رویدادی ثبت نشده است.</div>
  </div>

  <div class="section-title">
    <span>وظایف و کارها</span>
    <span id="tasksCount">۰</span>
  </div>
  <div class="items-list" id="tasksList">
    <div class="empty-state">وظیفه‌ای ثبت نشده است.</div>
  </div>

  <div class="section-title">یادداشت فوری</div>
  <div class="quick-note">
    <textarea id="noteInput" placeholder="متن یادداشت جدید..."></textarea>
    <button id="btnSaveNote">ذخیره یادداشت</button>
  </div>

  <div class="status-bar">
    <span id="syncStatus">آماده همگام‌سازی</span>
    <a href="newtab.html" target="_blank" style="color: var(--primary-dark); text-decoration: none; font-weight: bold;">داشبورد کامل ↗</a>
  </div>

  <script src="persian-date.js"></script>
  <script src="prayer-times.js"></script>
  <script src="sync-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
